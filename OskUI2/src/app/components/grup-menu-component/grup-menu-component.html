<div class="btn-group">
  <span
    class="grup-menu-trigger"
    (click)="op.toggle($event)"
  >
    <i class="fa fa-ellipsis-v"></i>
  </span>

  <p-popover #op appendTo="body" styleClass="grup-menu-popover">
      <div class="d-flex flex-column custom-menu-container" (click)="op.hide()">
          <ng-content></ng-content>
      </div>
  </p-popover>
</div>
